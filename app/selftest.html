<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Self-test</title>
<link rel="stylesheet" href="app.css">
<style>
  .view { padding: 20px; }
  .t { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; line-height: 1.7; }
  .ok { color: var(--accent); }
  .bad { color: var(--again); }
  .sum { font-size: 17px; margin: 0 0 16px; }
</style>
</head>
<body data-theme="light">
<main class="view">
  <h1 class="title">Self-test</h1>
  <p class="note">The app-side half of hard rule 3. Asserts the data invariants the UI depends on, and greps the app source for Hebrew characters (hard rule 1). Open this after any data regeneration. Must be served over http — <code>file://</code> blocks the source fetches.</p>
  <p class="sum" id="sum">Running…</p>
  <div class="t" id="out"></div>
</main>

<script type="module">
import { DECK_URL, loadDeck, PARSE_DECK_URL, loadParseDeck, FUNCTION_WORD_EXAMPLES_URL, loadFunctionWordExamples, READER_CHAPTERS, loadReaderData, LESSON_GROUPS, loadLessonGroup } from './main.js';
import { newCard, applyGrade, describeInterval, GRADES } from './srs.js';

const out = document.getElementById('out');
const failures = [];
let checks = 0;

function ok(msg) {
  checks++;
  const d = document.createElement('div');
  d.className = 'ok';
  d.textContent = 'pass  ' + msg;
  out.appendChild(d);
}
function bad(msg) {
  checks++;
  failures.push(msg);
  const d = document.createElement('div');
  d.className = 'bad';
  d.textContent = 'FAIL  ' + msg;
  out.appendChild(d);
}
function check(cond, msg) { cond ? ok(msg) : bad(msg); }

const TRANSLIT_RE = /^['`a-z]+$/;
// Escapes, not literals: hard rule 1 forbids Hebrew characters in app source,
// and this file is not exempt from the rule it enforces.
const HEBREW_RE = /[\u05D0-\u05EA]/;

const APP_FILES = [
  'main.js', 'store.js', 'srs.js', 'theme.js', 'feedback.js', 'sync.js', 'app.css',
  'views/vocab.js', 'views/parse.js', 'views/read.js', 'views/learn.js', 'views/settings.js', 'selftest.html',
  'browse.html', 'browse.js', 'translit_display.js',
];

async function run() {
  let deck;
  try {
    deck = await loadDeck();
    ok(`deck loaded from ${DECK_URL.pathname}`);
  } catch (e) {
    bad(`deck failed to load: ${e.message}`);
    return finish();
  }

  // 600 minus 9 Aramaic loanwords and 2 poetry-only particles, cut at the
  // curation stage (see build_vocab_deck.py) -- not backfilled to a round 600.
  check(deck.length === 589, `deck has 589 entries (got ${deck.length})`);

  const ranks = new Set(deck.map(e => e.rank));
  const missing = [];
  for (let r = 1; r <= deck.length; r++) if (!ranks.has(r)) missing.push(r);
  check(missing.length === 0, `ranks 1-${deck.length} with no gaps${missing.length ? ` (missing ${missing.slice(0,8).join(',')}…)` : ''}`);
  check(ranks.size === deck.length, 'no duplicate ranks');

  let noHeb = 0, badTrans = 0, noGloss = 0, noPos = 0, aramaic = 0, badFlags = 0;
  for (const e of deck) {
    if (!e.citation_form || !HEBREW_RE.test(e.citation_form)) noHeb++;
    if (!e.transliteration || !TRANSLIT_RE.test(e.transliteration)) badTrans++;
    if (!e.gloss || !e.gloss.trim()) noGloss++;
    if (!e.pos) noPos++;
    if (e.gloss && e.gloss.includes('(Aramaic)')) aramaic++;
    if (typeof e.is_function_word !== 'boolean' || typeof e.drillable !== 'boolean') badFlags++;
  }
  check(noHeb === 0, `every entry has Hebrew in citation_form (${noHeb} bad)`);
  check(badTrans === 0, `every transliteration is in the locked ASCII scheme (${badTrans} bad)`);
  check(noGloss === 0, `every entry has a gloss — hard rule 4 (${noGloss} bad)`);
  check(noPos === 0, `every entry has a part of speech (${noPos} bad)`);
  check(aramaic === 0, `no Aramaic entries remain (${aramaic} found)`);
  check(badFlags === 0, `is_function_word/drillable are booleans on every entry (${badFlags} bad)`);

  // H854 ('et) is folded into H5973 (`im) -- both just mean "with" -- via
  // build_vocab_deck.py's MERGED_LEMMAS. See merged_with/merged_into there.
  const byLemma = Object.fromEntries(deck.map(e => [e.lemma_id, e]));
  const primary = byLemma['H5973'], secondary = byLemma['H854'];
  const mergeOk = primary && secondary
    && primary.merged_with && primary.merged_with.lemma_id === 'H854'
    && primary.merged_with.citation_form === secondary.citation_form
    && secondary.merged_into === 'H5973'
    && secondary.drillable === false
    && primary.gloss === secondary.gloss;
  check(mergeOk, 'H854 merges into H5973 (merged_with/merged_into agree, H854 non-drillable, glosses match)');

  let badConfusable = 0;
  for (const e of deck) {
    if ('confusable_with' in e && (typeof e.confusable_with !== 'string' || !e.confusable_with.trim())) badConfusable++;
  }
  check(badConfusable === 0, `confusable_with, where present, is non-empty (${badConfusable} bad)`);

  const sorted = [...deck].sort((a, b) => a.rank - b.rank);
  let descending = true;
  for (let i = 1; i < sorted.length; i++) {
    if (sorted[i].frequency > sorted[i - 1].frequency) { descending = false; break; }
  }
  check(descending, 'frequency is non-increasing as rank rises');

  let parseDeck;
  try {
    parseDeck = await loadParseDeck();
    ok(`parse deck loaded from ${PARSE_DECK_URL.pathname}`);
  } catch (e) {
    bad(`parse deck failed to load: ${e.message}`);
    parseDeck = [];
  }
  if (parseDeck.length) {
    const CONJS = new Set(['qatal', 'weqatal', 'wayyiqtol', 'yiqtol', 'participle', 'infinitive_construct']);
    let badForm = 0, badGloss = 0, badConj = 0, badPgn = 0, badWhole = 0, dupIds = 0, badRootSpan = 0;
    const seenIds = new Set();
    for (const e of parseDeck) {
      if (!e.surface_form || !HEBREW_RE.test(e.surface_form)) badForm++;
      if (!e.transliteration || !TRANSLIT_RE.test(e.transliteration)) badForm++;
      if (!e.verb_form || !HEBREW_RE.test(e.verb_form)) badForm++;
      if (!e.root_citation_form || !HEBREW_RE.test(e.root_citation_form)) badForm++;
      if (!e.root_transliteration || !TRANSLIT_RE.test(e.root_transliteration)) badForm++;
      if (!e.gloss || !e.gloss.trim()) badGloss++;
      if (!CONJS.has(e.conjugation)) badConj++;
      if (e.conjugation === 'infinitive_construct') {
        if (e.person || e.gender || e.number || e.state) badPgn++;
      } else if (e.conjugation === 'participle') {
        if (e.person || !e.gender || !e.number || !e.state) badPgn++;
      } else if (!e.person || !e.gender || !e.number || e.state) badPgn++;
      // Mechanical check for the old truncated-card bug: the verb's own
      // morpheme, wrapped by whatever prefix/suffix surrounds it, must
      // reconstruct the whole displayed word exactly -- a fragment (a
      // stripped wayyiqtol vav, a dropped pronominal suffix) fails this.
      const whole = (e.prefix_form || '') + e.verb_form + (e.suffix_form || '');
      if (whole !== e.surface_form) badWhole++;
      // The root-highlight fields (see build_parse_qal.py's find_root_span):
      // preformative/root_span/afformative must reconstruct verb_form, and
      // root_span itself must be non-empty -- an empty root_span would mean
      // the card highlights nothing as the root at all.
      const verbWhole = (e.preformative || '') + (e.root_span || '') + (e.afformative || '');
      if (verbWhole !== e.verb_form || !e.root_span) badRootSpan++;
      if (seenIds.has(e.id)) dupIds++;
      seenIds.add(e.id);
    }
    check(badForm === 0, `every parse entry has well-formed Hebrew + transliteration (${badForm} bad)`);
    check(badGloss === 0, `every parse entry has a gloss — hard rule 4 (${badGloss} bad)`);
    check(badConj === 0, `every parse entry has a recognized conjugation (${badConj} bad)`);
    check(badWhole === 0, `every parse entry's prefix+verb+suffix reconstructs its surface_form (${badWhole} bad)`);
    check(badRootSpan === 0, `every parse entry's preformative+root_span+afformative reconstructs its verb_form (${badRootSpan} bad)`);
    check(badPgn === 0, `every parse entry's person/gender/number/state matches its conjugation's shape (${badPgn} bad)`);
    check(dupIds === 0, `no duplicate parse entry ids (${dupIds} dupes)`);
  }

  let wex;
  try {
    wex = await loadFunctionWordExamples();
    ok(`function-word examples loaded from ${FUNCTION_WORD_EXAMPLES_URL.pathname}`);
  } catch (e) {
    bad(`function-word examples failed to load: ${e.message}`);
    wex = {};
  }
  const wexEntries = Object.values(wex);
  // Mirrors build_function_word_examples.py's TIER_TARGET (tier-1 particles
  // curated to 10 examples instead of the baseline 3) -- redeclared here too,
  // per this project's independent-recheck convention.
  const TIER_TARGET = {
    'F-l': 10, 'F-b': 10, 'F-m': 10, 'H4480': 10, 'H5921': 10, 'H3588': 10,
    'F-k': 10, 'H5704': 10, 'H310': 10, 'H8478': 10, 'H5048': 10,
    'H413': 5, 'H834': 5, 'H518': 5, 'H5973': 5, 'H854': 5, 'H2009': 5,
    'H2005': 5, 'H369': 5, 'H3426': 5, 'H3651': 5, 'H1571': 5, 'H637': 5,
    'H389': 5, 'H7535': 5, 'H1115': 5, 'H1157': 5, 'H3644': 5, 'F-s': 5,
    'H4616': 5,
  };
  if (wexEntries.length) {
    const VERSE_TRANSLIT_RE = /^['`a-z .,;:!?‘’]+$/;
    let badCount = 0, badForm2 = 0, badGloss2 = 0, badSenseCount = 0, badIndex = 0, badHighlight = 0;
    for (const e of wexEntries) {
      const senses = e.full_gloss.split(',').map(s => s.trim()).filter(Boolean);
      const needed = Math.max(TIER_TARGET[e.lemma_id] || 3, senses.length);
      if (e.examples.length < needed) badCount++;
      if (e.sense_count !== senses.length) badSenseCount++;
      for (const ex of e.examples) {
        if (!ex.surface_form || !HEBREW_RE.test(ex.surface_form)) badForm2++;
        if (!ex.phrase_hebrew || !HEBREW_RE.test(ex.phrase_hebrew)) badForm2++;
        if (!ex.transliteration || !TRANSLIT_RE.test(ex.transliteration)) badForm2++;
        if (!ex.phrase_transliteration || !VERSE_TRANSLIT_RE.test(ex.phrase_transliteration)) badForm2++;
        if (!ex.gloss || !ex.gloss.trim()) badGloss2++;
        const words = ex.phrase_hebrew.split(' ');
        if (!Number.isInteger(ex.target_index) || ex.target_index < 0 || ex.target_index >= words.length) badIndex++;
        if (!ex.gloss_highlight || !ex.gloss.includes(ex.gloss_highlight)) badHighlight++;
        if (ex.gloss_note != null && !ex.gloss_note.trim()) badHighlight++;
      }
    }
    // 51 target lemmas minus the 6 (4 Aramaic particles + selah + bal) cut
    // from the vocab deck along with the rest of the Aramaic/poetry-only set.
    check(wexEntries.length === 45, `function-word examples cover all 45 target lemmas (got ${wexEntries.length})`);
    check(badSenseCount === 0, `every entry's sense_count matches its own full_gloss (${badSenseCount} bad)`);
    check(badCount === 0, `every entry has >= max(3, sense count) examples (${badCount} bad)`);
    check(badForm2 === 0, `every example has well-formed Hebrew + transliteration (${badForm2} bad)`);
    check(badGloss2 === 0, `every example has a non-empty gloss (${badGloss2} bad)`);
    check(badIndex === 0, `every example's target_index points at a real word in its phrase (${badIndex} bad)`);
    check(badHighlight === 0, `every example's gloss_highlight is a real substring of its gloss, and gloss_note (if any) is non-empty (${badHighlight} bad)`);
  }

  const vocabIds = new Set(deck.map(e => e.lemma_id));
  for (const chapter of READER_CHAPTERS) {
    let readerData;
    try {
      readerData = await loadReaderData(chapter.key);
      ok(`reader data loaded from ${chapter.url.pathname}`);
    } catch (e) {
      bad(`${chapter.label} reader data failed to load: ${e.message}`);
      continue;
    }

    const words = readerData.verses.flatMap(v => v.words);
    check(readerData.verses.length === readerData.metadata.verse_count,
      `${chapter.label}: verse count matches metadata (${readerData.verses.length} vs ${readerData.metadata.verse_count})`);
    check(words.length === readerData.metadata.word_count,
      `${chapter.label}: word count matches metadata (${words.length} vs ${readerData.metadata.word_count})`);

    let badForm = 0, badGloss = 0, badKnown = 0, dupIds = 0;
    const seenIds = new Set();
    for (const w of words) {
      if (!w.surface_form || !HEBREW_RE.test(w.surface_form)) badForm++;
      if (!w.transliteration || !TRANSLIT_RE.test(w.transliteration)) badForm++;
      if (!w.gloss || !w.gloss.trim()) badGloss++;
      const expectedKnown = w.lemma_ids.every(id => vocabIds.has(id));
      if (w.is_known !== expectedKnown) badKnown++;
      if (seenIds.has(w.id)) dupIds++;
      seenIds.add(w.id);
    }
    check(badForm === 0, `${chapter.label}: every word has well-formed Hebrew + transliteration (${badForm} bad)`);
    check(badGloss === 0, `${chapter.label}: every word has a gloss — hard rule 4 (${badGloss} bad)`);
    check(badKnown === 0, `${chapter.label}: every word's is_known matches vocab_deck_600 membership (${badKnown} bad)`);
    check(dupIds === 0, `${chapter.label}: no duplicate word ids (${dupIds} dupes)`);
  }

  // Every example is either single-word (surface_form/base_form/highlight at
  // the top level, like group 1) or a multi-word chain (a `tokens` array,
  // each shaped like a single-word example plus its own `role`, and a
  // phrase_gloss instead of a top-level gloss, like group 2's construct
  // chains). Both shapes get the same well-formedness checks, just applied
  // per-token for chains.
  function checkWordShape(w, counters) {
    if (!w.surface_form || !HEBREW_RE.test(w.surface_form)) counters.badForm++;
    if (!w.transliteration || !TRANSLIT_RE.test(w.transliteration)) counters.badForm++;
    const whole = (w.prefix_form || '') + w.base_form + (w.suffix_form || '');
    if (whole !== w.surface_form) counters.badWhole++;
  }

  for (const group of LESSON_GROUPS) {
    let lessons;
    try {
      lessons = await loadLessonGroup(group.key);
      ok(`lessons (${group.key}) loaded from ${group.url.pathname}`);
    } catch (e) {
      bad(`lessons (${group.key}) failed to load: ${e.message}`);
      continue;
    }
    check(lessons.lessons.length === lessons.metadata.lesson_count,
      `lessons (${group.key}): lesson count matches metadata (${lessons.lessons.length} vs ${lessons.metadata.lesson_count})`);
    const allExamples = lessons.lessons.flatMap((l) => l.examples);
    check(allExamples.length === lessons.metadata.example_count,
      `lessons (${group.key}): example count matches metadata (${allExamples.length} vs ${lessons.metadata.example_count})`);

    const c = { badForm: 0, badWhole: 0 };
    let badTitle = 0, badParagraphs = 0, badGloss = 0, badHighlight = 0;
    for (const l of lessons.lessons) {
      if (!l.title || !l.title.trim()) badTitle++;
      if (!l.paragraphs || !l.paragraphs.length || l.paragraphs.some((p) => !p.trim())) badParagraphs++;
      for (const ex of l.examples) {
        if (!ex.note || !ex.note.trim()) badGloss++;
        if (ex.tokens) {
          if (!ex.phrase_gloss || !ex.phrase_gloss.trim()) badGloss++;
          for (const tok of ex.tokens) {
            checkWordShape(tok, c);
            if (!['construct', 'absolute', 'plain'].includes(tok.role)) badHighlight++;
          }
        } else {
          checkWordShape(ex, c);
          if (!ex.gloss || !ex.gloss.trim()) badGloss++;
          if (!['prefix', 'base', 'suffix'].includes(ex.highlight)) badHighlight++;
        }
      }
    }
    check(badTitle === 0, `lessons (${group.key}): every lesson has a title (${badTitle} bad)`);
    check(badParagraphs === 0, `lessons (${group.key}): every lesson has non-empty paragraphs (${badParagraphs} bad)`);
    check(c.badForm === 0, `lessons (${group.key}): every example has well-formed Hebrew + transliteration (${c.badForm} bad)`);
    check(c.badWhole === 0, `lessons (${group.key}): every example's prefix+base+suffix reconstructs its surface_form (${c.badWhole} bad)`);
    check(badGloss === 0, `lessons (${group.key}): every example has a gloss and a note — hard rule 4 (${badGloss} bad)`);
    check(badHighlight === 0, `lessons (${group.key}): every example names a valid highlight/role (${badHighlight} bad)`);
  }

  // Hard rule 1, app-side: no Hebrew letters anywhere in /app/ source.
  for (const f of APP_FILES) {
    try {
      const res = await fetch(new URL(f, import.meta.url), { cache: 'no-cache' });
      const text = await res.text();
      const hits = text.match(new RegExp('[\\u05D0-\\u05EA]', 'g'));
      check(!hits, `no Hebrew letters in app/${f}${hits ? ` (${hits.length} found)` : ''}`);
    } catch (e) {
      bad(`could not read app/${f} to check for Hebrew: ${e.message}`);
    }
  }

  // Scheduler sanity. Not testing FSRS itself -- testing that our serialise /
  // deserialise round-trip keeps it working, which is the part we wrote.
  const now = new Date();
  const fresh = newCard(now);
  check(new Date(fresh.due).toString() !== 'Invalid Date', 'a new card has a valid due date');

  const good = applyGrade(fresh, 'good', now);
  const again = applyGrade(fresh, 'again', now);
  check(new Date(good.due) > new Date(again.due), 'Good schedules further out than Again');

  const roundTripped = JSON.parse(JSON.stringify(good));
  const second = applyGrade(roundTripped, 'good', new Date(roundTripped.due));
  check(new Date(second.due) > new Date(roundTripped.due),
    'a card survives a JSON round-trip and still schedules forward');

  let prev = fresh, at = now, growing = true;
  for (let i = 0; i < 5; i++) {
    const next = applyGrade(JSON.parse(JSON.stringify(prev)), 'good', at);
    const gap = new Date(next.due) - at;
    const prevGap = new Date(prev.due) - at;
    if (i > 1 && gap <= prevGap) growing = false;
    at = new Date(next.due);
    prev = next;
  }
  check(growing, 'repeated Good produces growing intervals');

  check(GRADES.length === 3, `three grade buttons, not four (got ${GRADES.length})`);
  check(describeInterval(now, new Date(now.getTime() + 86400000)) === '1d',
    'interval formatting: 24h reads as 1d');

  finish();
}

function finish() {
  const sum = document.getElementById('sum');
  if (failures.length) {
    sum.className = 'sum bad';
    sum.textContent = `${failures.length} of ${checks} checks FAILED.`;
  } else {
    sum.className = 'sum ok';
    sum.textContent = `All ${checks} checks passed.`;
  }
}

run();
</script>
</body>
</html>
